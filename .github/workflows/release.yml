name: Release

# Every push to main builds the app and publishes it as the only release,
# named like "Sports Hub 1.0.12 (latest)". Older releases and their tags are removed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Set up release signing key
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key."
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 secret not set; signing with the debug key."
          fi

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: ./gradlew assembleRelease -PbuildNumber=$BUILD_NUMBER --stacktrace

      - name: Remove older releases
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r tag; do
            gh release delete "$tag" --yes --cleanup-tag
          done

      - name: Publish release
        run: |
          VERSION="1.0.$BUILD_NUMBER"
          cp app/build/outputs/apk/release/app-release.apk "sports-hub-$VERSION.apk"
          gh release create "v$VERSION" "sports-hub-$VERSION.apk" \
            --title "Sports Hub $VERSION (latest)" \
            --notes "Built from ${GITHUB_SHA::7}. Download the APK below and open it on your Android phone to install." \
            --target "$GITHUB_SHA" \
            --latest
